name: Update game results

# Once a day at 8:00 AM Eastern: finalizes every game played since the last
# run (Thursday through Monday nights) and refreshes the betting lines.
#
# GitHub's scheduler only speaks UTC and ignores daylight saving, so both
# possible UTC times are scheduled and the job keeps only the one that is
# 8 AM in New York today:
#   EDT (Mar–Nov, UTC-4) -> 12:00 UTC
#   EST (Nov–Mar, UTC-5) -> 13:00 UTC
# The choice uses New York's current UTC offset, not the clock, so a run that
# GitHub starts late still counts.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      odds:
        description: "Also refresh point spreads"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is it 8 AM Eastern?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Manual run."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=America/New_York date +%z)      # -0400 in EDT, -0500 in EST
          if [ "$offset" = "-0400" ]; then want="0 12 * * *"; else want="0 13 * * *"; fi
          if [ "$SCHEDULE" = "$want" ]; then
            echo "8 AM Eastern run (New York is UTC$offset)."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the 8 AM Eastern trigger today (New York is UTC$offset) - skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch results and lines
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS: ${{ github.event_name == 'schedule' || inputs.odds == true }}
        run: |
          if [ "$ODDS" = "true" ]; then
            python scripts/update_results.py --odds
          else
            python scripts/update_results.py
          fi

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/results.json && git ls-files --error-unmatch data/results.json >/dev/null 2>&1; then
            echo "No result changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Update game results"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
